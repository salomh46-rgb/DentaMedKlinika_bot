version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dentamed_api
    restart: always
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/clinics"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: python -m uvicorn server:app --app-dir backend --host 0.0.0.0 --port 8000

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dentamed_bot
    restart: always
    env_file:
      - backend/.env
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      api:
        condition: service_healthy
    command: python backend/bot.py

  nginx:
    image: nginx:alpine
    container_name: dentamed_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
